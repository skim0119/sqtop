[package]
name = "sqtop"
version = "0.1.2"
edition = "2021"
description = "Read-only Slurm schedule explorer over SSH"
license = "MIT"
readme = "README.md"
keywords = ["slurm", "hpc", "tui", "ssh", "scheduling"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
anyhow = "1"
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
openssh = "0.11"
tempfile = "3"
