name: Update Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example, v0.1.0)
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/homebrew.yml
      - .github/scripts/*homebrew.py

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  update:
    concurrency:
      group: update-homebrew-tap
      cancel-in-progress: false
    needs: test
    if: github.event_name != 'pull_request' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check release and credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo '::error::Set HOMEBREW_TAP_TOKEN with Contents read/write access to skim0119/homebrew-tap.'
            exit 1
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --repo skim0119/sqtop --json isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == false)' > release.json
          test -s release.json
      - uses: actions/checkout@v6
        with:
          repository: skim0119/homebrew-tap
          ref: main
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Update formula
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/skim0119/sqtop/archive/refs/tags/${TAG}.tar.gz" \
            --output release.tar.gz
          python3 .github/scripts/update_homebrew.py tap/Formula/sqtop.rb "$TAG" release.tar.gz
      - name: Commit and push
        working-directory: tap
        run: |
          if git diff --quiet -- Formula/sqtop.rb; then
            echo 'Formula already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/sqtop.rb
          git commit -m "Update sqtop to ${TAG}"
          git push origin HEAD:main
